<script>
(function () {
  const ids = Object.keys(JOURNALS).map(Number);
  const id = Number(new URLSearchParams(location.search).get('id')) || ids[0];
  const j = JOURNALS[id] || JOURNALS[ids[0]];
  const k = ids.indexOf(j.id);
  const prev = JOURNALS[ids[(k - 1 + ids.length) % ids.length]];
  const next = JOURNALS[ids[(k + 1) % ids.length]];
  document.title = `${j.title} · Garvit Yaggik`;
  document.getElementById('article').innerHTML = `
    <a href="../index.html#journal" class="cs-back mono">← All entries</a>
    <span class="mono red">${j.category} · ${j.date} · ${j.readTime}</span>
    <h1>${j.title}</h1>
    <p class="intro">${j.intro}</p>
    ${j.sections.map(s => `<h2>${s.heading}</h2><p>${s.body}</p>`).join('')}
    <nav class="article-nav">
      <a href="journal.html?id=${prev.id}"><span class="mono dim">← Previous</span><h4>${prev.title}</h4></a>
      <a href="journal.html?id=${next.id}" class="next"><span class="mono dim">Next →</span><h4>${next.title}</h4></a>
    </nav>`;
})();
</script>
