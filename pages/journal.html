<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal — Garvit Yaggik</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/journals.css" />
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.19/dist/lenis.min.js"></script>
  <style>
    .article-page { max-width: 820px; margin: 0 auto; padding: 100px 32px 80px; }

    .article-banner {
      width: 100%;
      aspect-ratio: 21/9;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 56px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .article-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5));
    }
    .article-banner .emoji {
      font-size: 120px;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,0.5));
      position: relative;
      z-index: 1;
    }

    .article-cat {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--orange);
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid var(--orange);
      border-radius: 100px;
      background: var(--orange-soft);
      margin-bottom: 28px;
    }
    .article-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(40px, 5.5vw, 76px);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 28px;
    }
    .article-meta {
      display: flex;
      gap: 18px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text2);
      letter-spacing: 0.08em;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }
    .article-meta span:nth-child(2)::before {
      content: "·";
      margin-right: 18px;
      color: var(--orange);
    }

    .article-intro {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 22px;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 56px;
    }

    .article-section { margin-bottom: 48px; }
    .article-section h2 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 28px;
      color: var(--orange);
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    .article-section p {
      color: var(--text2);
      font-size: 17px;
      line-height: 1.8;
    }

    .pull-quote {
      margin: 56px 0;
      padding: 4px 28px;
      border-left: 3px solid var(--orange);
      font-family: var(--font-display);
      font-weight: 700;
      font-style: italic;
      font-size: 26px;
      line-height: 1.4;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .author-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 28px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 64px 0 48px;
    }
    .author-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--grad-text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 18px;
      color: #0a0a0a;
      flex-shrink: 0;
    }
    .author-info h4 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .author-info p {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text2);
    }

    .related-section {
      max-width: 1280px;
      margin: 64px auto 0;
      padding: 56px 32px 0;
      border-top: 1px solid var(--border);
    }
    .related-section .lbl {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 28px;
    }
    .related-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 700px) {
      .article-page { padding: 90px 22px 60px; }
      .related-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<canvas id="cursor-trail"></canvas>
<div id="scroll-progress"></div>

<a href="../index.html#journals" class="page-back">← Back to Journal</a>

<main id="articleMain">
  <article class="article-page" id="articleBody"></article>

  <section class="related-section">
    <div class="lbl">// Related entries</div>
    <div class="related-grid" id="relatedGrid"></div>
  </section>
</main>

<footer>
  <span class="footer-logo">GARVIT YAGGIK</span>
  <span class="footer-copy">© 2025 — Designed &amp; Built with intent</span>
  <div class="footer-links">
    <a href="https://behance.net/garvityagnik" target="_blank" rel="noopener">Behance</a>
    <a href="https://linkedin.com/in/garvit-yaggik-5925b3114" target="_blank" rel="noopener">LinkedIn</a>
    <a href="mailto:garvityagnik@gmail.com">Email</a>
  </div>
  <div class="footer-nav">
    <a href="../index.html#hero">Home</a>
    <a href="../index.html#work">Work</a>
    <a href="../index.html#journals">Journal</a>
    <a href="../index.html#about">About</a>
    <a href="resume.html">Resume</a>
  </div>
</footer>

<script src="../js/router.js"></script>
<script src="../js/cursor.js"></script>
<script src="../js/lenis-init.js"></script>
<script>
const JOURNALS = {
  1: {
    id: 1,
    title: "Design is Business First, Aesthetics Second",
    category: "Design Philosophy",
    date: "May 2025",
    readTime: "5 min read",
    bannerGradient: "linear-gradient(135deg,#0f0f1a,#1a1040)",
    bannerEmoji: "🧠",
    intro: "Every brief has a business problem hiding inside it. The sooner you find it, the better the work gets — and the fewer revisions you do.",
    sections: [
      { heading: "The Question No One Asks", body: "Most designers jump straight to moodboards. I've learned to sit with the brief for longer and ask one question first: what does this design need to DO? Not look like. Do. Is it selling something? Reassuring someone? Signalling status? That question changes everything." },
      { heading: "What I Learned at Publicis", body: "Working inside a global agency taught me that beautiful work that doesn't serve the business objective is just expensive decoration. Every stakeholder has a number they're trying to move. Your job is to move it — beautifully." },
      { heading: "Aesthetics as a Tool", body: "This doesn't mean aesthetics don't matter. They matter enormously. But they're a tool, not a goal. The goal is always the outcome. Aesthetics are how you get there with craft." },
      { heading: "The Practical Shift", body: "Next time you get a brief, before you open Figma — write one sentence: 'This design succeeds when ___.' Fill in the blank with a business outcome, not a visual description. Then design backwards from that sentence." }
    ]
  },
  2: {
    id: 2,
    title: "AI as a Production Tool, Not a Replacement",
    category: "Workflow",
    date: "Apr 2025",
    readTime: "7 min read",
    bannerGradient: "linear-gradient(135deg,#0a1a0a,#0f2a10)",
    bannerEmoji: "⚡",
    intro: "Midjourney, Runway, Claude — I use all of them. Here is how I actually integrate AI into real creative work without losing the craft.",
    sections: [
      { heading: "The Tool That Changed My Brief Stage", body: "Claude changed how I start every project. I dump the brief, the client context, and my initial instincts into a conversation. I get back a structured problem statement, alternative angles, and questions I hadn't thought to ask. The brief stage went from 2 hours to 30 minutes." },
      { heading: "Midjourney for Moodboarding", body: "I stopped making traditional moodboards. Now I generate 20-30 directional images in Midjourney, pick the 6 that feel right, and use those as my visual brief. Faster, more specific, and clients understand them better than Pinterest boards." },
      { heading: "Runway for Motion Concepting", body: "Before I open After Effects, I use Runway to rough out motion concepts. It's not final quality — but it's fast enough to test whether an idea works before investing hours in execution." },
      { heading: "What AI Cannot Replace", body: "Judgment. The ability to read a room. Knowing when a client says they want X but actually need Y. The craft of making something that feels inevitable rather than generated. AI compresses time. It doesn't replace taste." }
    ]
  },
  3: {
    id: 3,
    title: "100+ Exhibitions: What Global Events Teach You About Scale",
    category: "Exhibition Design",
    date: "Mar 2025",
    readTime: "6 min read",
    bannerGradient: "linear-gradient(135deg,#1a0a00,#2a1500)",
    bannerEmoji: "🏛️",
    intro: "CES, MWC, Auto Expo — designing for floors that hold thousands of people is a completely different craft. Here is what I learned.",
    sections: [
      { heading: "Design at Human Scale", body: "The first time I stood inside a booth I had designed, I realised: everything I knew about screen design was wrong at this scale. Type that looks bold on screen disappears at 20 feet. Negative space that feels elegant in Figma feels empty in a 400sqft booth." },
      { heading: "The 3-Second Rule", body: "At an exhibition, you have 3 seconds to communicate what the company does as someone walks past. That constraint is ruthless and clarifying. One hero message. Maximum contrast. Zero cleverness." },
      { heading: "Building for Vendors Worldwide", body: "Files go to print vendors in Las Vegas, Barcelona, Dubai, and Delhi — all in the same month. CMYK profiles differ. Material specs differ. I learned to build systems that survive the translation." },
      { heading: "The System Behind 100 Events", body: "By event 10, I stopped designing from scratch. I built a modular grid system — locked proportions, defined zones, consistent hierarchy rules. Every new event was a configuration, not a redesign. That is how you do 100+ without burning out." }
    ]
  },
  4: {
    id: 4,
    title: "Dark & Minimal: Why I Design the Way I Do",
    category: "Aesthetics",
    date: "Feb 2025",
    readTime: "4 min read",
    bannerGradient: "linear-gradient(135deg,#0a0a1a,#10082a)",
    bannerEmoji: "🌑",
    intro: "My father was a photographer. I was editing images before I was 10. Here is how that shapes every design decision I make.",
    sections: [
      { heading: "Learning in the Darkroom", body: "Not literally — but close. Growing up around photography means you learn to see before you learn to design. You learn that light is the subject, not the object. That shadow is not absence — it is presence. That lesson is in everything I make." },
      { heading: "Why Dark", body: "Dark backgrounds make colour behave differently. Accents glow rather than sit. Type gains weight. The eye is directed rather than scattered. Dark is not a mood — it is a tool for control." },
      { heading: "Why Minimal", body: "Every element I add costs the viewer attention. Attention is the only currency in design. Minimal is not laziness — it is respect for that currency. Every line, every word, every colour has to earn its place." },
      { heading: "The Ongoing Practice", body: "I still take photographs. I still edit them. It keeps my eye sharp in a way that screen work alone cannot. The best design training I ever had was standing in a field waiting for the light to change." }
    ]
  },
  5: {
    id: 5,
    title: "Sole Designer Survival Guide",
    category: "Career",
    date: "Jan 2025",
    readTime: "8 min read",
    bannerGradient: "linear-gradient(135deg,#1a1000,#2a1e00)",
    bannerEmoji: "🔧",
    intro: "No handoffs, no safety nets. Here is the system I built to stay sane and ship good work as the only designer in the room.",
    sections: [
      { heading: "The Weight of Full Ownership", body: "Every role I have held has been as the sole designer. No senior to review my work. No junior to delegate to. Every decision mine. Every deadline mine. That is clarifying in a way that collaborative environments are not — but it requires a system, or it breaks you." },
      { heading: "Triage Is the Skill", body: "At Publicis I managed 15+ stakeholders simultaneously. The skill is not speed — it is triage. Which request moves the business? Which can wait? Which is urgent but not important? I built a simple scoring system. It cut my revision cycles from 4-5 rounds to 1-2." },
      { heading: "Templates Are Not Cheating", body: "I built templates for everything — not to skip thinking, but to move faster once the thinking was done. A good template is a decision made once that frees you to focus on the parts that actually need thought." },
      { heading: "Knowing When to Push Back", body: "The hardest skill for a sole designer is saying no to scope creep in real time. Not in a confrontational way — in a clarifying way. 'If we add this, we move that. Which matters more?' That question has saved more projects than any design decision I have ever made." }
    ]
  },
  6: {
    id: 6,
    title: "My Approach — Instinct, Iteration, Intent",
    category: "Process",
    date: "Dec 2024",
    readTime: "6 min read",
    bannerGradient: "linear-gradient(135deg,#1a0a10,#200818)",
    bannerEmoji: "🎯",
    intro: "How instinct guides the first move, iteration sharpens the craft, and intent holds everything together in real projects.",
    sections: [
      { heading: "Start With Instinct", body: "Every project begins with a gut reaction. Before research, before moodboards, I sit with the brief and ask: what does this feel like? That first instinct is rarely the final answer, but it is always the starting point. Ignoring it means starting from someone else's reference instead of your own perspective." },
      { heading: "Iterate Without Attachment", body: "The biggest trap for designers is falling in love with version one. I force myself to explore at least three directions before committing. Not because the first idea is bad — but because the third version has absorbed everything the first two taught me." },
      { heading: "Intent Over Decoration", body: "Every element in a design should be able to answer: why are you here? If the answer is 'because it looks cool,' it gets cut. Intent means every colour, every typeface, every spacing decision is serving the project's goal. Decoration fills space. Intent directs attention." },
      { heading: "How This Looks in Practice", body: "At VVDN, this meant designing 100+ exhibitions with a system that survived translation across vendors worldwide. At Publicis, it meant managing 15+ stakeholders with a triage system that cut revision rounds in half. At Digi2L, it meant building an entire brand from zero with no team. The approach adapts. The principles don't." }
    ]
  },
  7: {
    id: 7,
    title: "Design Thinking and My Approach to Problem Solving",
    category: "Process",
    date: "May 2025",
    readTime: "7 min read",
    bannerGradient: "linear-gradient(135deg,#0f1a1a,#0a2020)",
    bannerEmoji: "💡",
    pullQuote: "The best design solutions come from asking better questions, not from having better ideas.",
    intro: "Design thinking is not a buzzword I put on my LinkedIn. It is the actual practice that shapes how I approach every brief, every client, every problem.",
    sections: [
      { heading: "What Design Thinking Actually Means", body: "Strip away the TED talks and the sticky-note workshops. Design thinking, at its core, is a commitment to understanding the problem before jumping to solutions. It means sitting with discomfort — the discomfort of not knowing the answer yet — and trusting the process to get you there. In practice, it looks like asking questions that feel obvious but nobody has asked. Why does this product exist? Who actually uses it? What happens if we do nothing? These questions feel basic, but they are the foundation everything else stands on." },
      { heading: "How I Start Every Brief", body: "Before I open Figma, before I touch a moodboard, I do three things. First, I read the brief three times — once to understand what the client wrote, once to understand what they meant, and once to find what they left out. Second, I research the business context. What are the competitors doing? Where does this project fit in the company's larger strategy? What number is this supposed to move? Third, I write a one-sentence success statement: 'This design succeeds when ___.' That sentence becomes my compass. Every decision I make from that point forward gets checked against it." },
      { heading: "Building Empathy Into the Work", body: "There is always a gap between what the client thinks the user needs and what the user actually needs. My job is to close that gap — diplomatically. At Publicis, I learned that stakeholders are not wrong; they just have a different view of the problem. A marketing director sees brand consistency. A sales lead sees conversion rates. An end user sees 'does this help me or waste my time?' I have to hold all three perspectives simultaneously and find the design that serves all of them. That is empathy in practice — not a persona document, but a genuine understanding of multiple viewpoints." },
      { heading: "Diverge Before You Converge", body: "The instinct is to find one good direction and run with it. I have learned to resist that instinct. Instead, I generate multiple directions — sometimes five or six — before committing to one. This feels slow, but it is actually faster. Here is why: when you present one direction, the feedback is 'I like it' or 'I do not like it.' When you present three directions, the feedback becomes 'I like this aspect of A and this aspect of C.' You learn more, you converge faster, and the final output is stronger because it has been pressure-tested against alternatives." },
      { heading: "Testing Ideas Before Executing Them", body: "I am a big believer in low-fidelity first. Before I spend hours polishing a layout, I rough it out — sometimes on paper, sometimes in a quick wireframe, sometimes using AI tools like Midjourney to test a visual direction. The goal is to fail fast. If an idea does not work at low fidelity, it will not work at high fidelity either. And the cost of discovering that early is minutes, not days. At Digi2L, I built the entire brand identity starting with rough sketches and concept tests before committing to any final direction. That saved weeks of revision later." },
      { heading: "My Personal Process in Practice", body: "At Publicis Groupe, design thinking meant managing 15+ stakeholders with conflicting priorities and finding the solution that moved the business forward. It meant building a newsletter system that reached 100,000+ employees, where every layout decision had to balance readability, brand consistency, and content hierarchy. At VVDN Technologies, it meant designing 100+ exhibition booths where the 3-second rule dominated everything — you have three seconds to communicate what the company does as someone walks past. At Digi2L, it meant building everything from scratch as the sole designer — brand identity, UI, marketing materials — with no team and no safety net. The process adapts to the context, but the thinking stays the same: understand the problem, explore the space, test early, execute with intent." }
    ]
  }
};

(function render() {
  const id = parseInt(Router.getParam('id'), 10) || 1;
  const j = JOURNALS[id] || JOURNALS[1];
  document.title = `${j.title} — Garvit Yaggik`;

  const half = Math.floor(j.sections.length / 2);
  let sectionsHtml = '';
  j.sections.forEach((s, i) => {
    sectionsHtml += `
      <div class="article-section">
        <h2>${s.heading}</h2>
        <p>${s.body}</p>
      </div>`;
    if (i === half - 1) {
      const quote = j.pullQuote || j.intro;
      sectionsHtml += `<blockquote class="pull-quote">"${quote}"</blockquote>`;
    }
  });

  document.getElementById('articleBody').innerHTML = `
    <div class="article-banner" style="background:${j.bannerGradient}">
      <span class="emoji">${j.bannerEmoji}</span>
    </div>
    <span class="article-cat">${j.category}</span>
    <h1 class="article-title">${j.title}</h1>
    <div class="article-meta">
      <span>${j.date}</span>
      <span>${j.readTime}</span>
    </div>
    <p class="article-intro">${j.intro}</p>
    ${sectionsHtml}
    <div class="author-card">
      <div class="author-avatar">GY</div>
      <div class="author-info">
        <h4>Garvit Yaggik</h4>
        <p>Designer · Art Director · Bangalore</p>
      </div>
    </div>
  `;

  // Related — pick the next 2 entries
  const ids = Object.keys(JOURNALS).map(n => parseInt(n, 10));
  const idx = ids.indexOf(j.id);
  const relIds = [
    ids[(idx + 1) % ids.length],
    ids[(idx + 2) % ids.length]
  ];
  const relHtml = relIds.map(rid => {
    const r = JOURNALS[rid];
    return `
      <a href="journal.html?id=${r.id}" class="journal-card">
        <div class="journal-banner" style="background:${r.bannerGradient}">
          <span class="journal-emoji">${r.bannerEmoji}</span>
        </div>
        <div class="journal-body">
          <p class="journal-tag">${r.category}</p>
          <h3 class="journal-title">${r.title}</h3>
          <p class="journal-excerpt">${r.intro}</p>
        </div>
        <div class="journal-foot">
          <span class="journal-date">${r.date}</span>
          <span class="journal-read">${r.readTime} →</span>
        </div>
      </a>`;
  }).join('');
  document.getElementById('relatedGrid').innerHTML = relHtml;
})();
</script>
</body>
