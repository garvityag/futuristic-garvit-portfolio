<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/base.css" />
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.19/dist/lenis.min.js"></script>
  <style>
    .project-page { padding: 100px 56px 80px; max-width: 1280px; margin: 0 auto; }
    .project-hero { padding-bottom: 48px; border-bottom: 1px solid var(--border); margin-bottom: 64px; }
    .project-cat-tag {
      display: inline-block; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.16em; color: var(--orange); text-transform: uppercase;
      padding: 6px 14px; border: 1px solid var(--orange); border-radius: 100px;
      background: var(--orange-soft); margin-bottom: 28px;
    }
    .project-hero h1 {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(48px, 7vw, 110px); letter-spacing: -0.04em;
      line-height: 0.95; margin-bottom: 32px;
    }
    .project-tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
    .project-tags-row span {
      font-family: var(--font-mono); font-size: 11px; padding: 6px 12px;
      border-radius: 8px; background: var(--surface); border: 1px solid var(--border2); color: var(--text);
    }
    .info-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .info-cell { padding: 24px 28px; border-right: 1px solid var(--border); background: var(--bg3); }
    .info-cell:last-child { border-right: 0; }
    .info-cell .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
    .info-cell .val { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--text); letter-spacing: -0.01em; }

    /* Image Carousel */
    .project-carousel { position: relative; margin: 56px 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .carousel-track { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--bg3); }
    .carousel-track img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
    .carousel-track img.active { opacity: 1; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: background 0.3s; }
    .carousel-btn:hover { background: rgba(255,107,43,0.7); }
    .carousel-btn-l { left: 16px; }
    .carousel-btn-r { right: 16px; }
    .carousel-dots { display: flex; gap: 8px; justify-content: center; padding: 14px 0; background: var(--bg3); }
    .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); cursor: pointer; transition: all 0.3s; }
    .carousel-dot.active { background: var(--orange); transform: scale(1.3); }

    .project-img { width: 100%; display: block; border-radius: 16px; margin: 24px 0; border: 1px solid var(--border); background: var(--surface); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; margin: 56px 0; }
    .block h3 { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--orange); margin-bottom: 14px; }
    .block p { color: var(--text2); font-size: 16px; line-height: 1.7; }
    .outcome-card { margin: 56px 0; padding: 36px 40px; border: 1px solid var(--orange); border-radius: var(--radius); background: linear-gradient(135deg, var(--orange-soft), transparent), var(--bg3); box-shadow: 0 0 40px var(--orange-glow); }
    .outcome-card .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--orange); margin-bottom: 14px; }
    .outcome-card p { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.3; color: var(--text); }
    .pn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 80px 0 0; padding-top: 48px; border-top: 1px solid var(--border); }
    .pn-card { padding: 28px 30px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .3s var(--ease); }
    .pn-card:hover { border-color: var(--orange); }
    .pn-card .dir { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--text2); margin-bottom: 10px; }
    .pn-card .name { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--text); }
    .pn-card.next { text-align: right; }
    /* PDF viewer */
    .pdf-wrap { margin: 56px 0; }
    .pdf-wrap iframe { width: 100%; height: 80vh; border: none; border-radius: 16px; background: #0d0d0d; }
    .pdf-link { display: inline-block; margin-top: 14px; font-family: var(--font-mono); font-size: 13px; color: var(--orange); letter-spacing: 0.06em; transition: color 0.3s; }
    .pdf-link:hover { color: var(--text); }

    @media (max-width: 900px) {
      .project-page { padding: 90px 22px 60px; }
      .info-bar { grid-template-columns: 1fr; }
      .info-cell { border-right: 0; border-bottom: 1px solid var(--border); }
      .info-cell:last-child { border-bottom: 0; }
      .two-col, .pn-row { grid-template-columns: 1fr; gap: 22px; }
    }
  </style>
</head>

    tags: ["Exhibition","Event","Large Format","Print"],
    overview: "Exhibition and event branding across multiple shows — booth panels, standees, backdrops, and large-format print creatives.",
    challenge: "Maintaining brand consistency across dozens of events with different venue specs and print vendors.",

  10: {

    tags: ["Report","Editorial","Layout","InDesign"],
    overview: "Corporate report with editorial composition, typography hierarchy, branding consistency, and professional visual presentation.",

(function render() {
  const id = parseInt(Router.getParam('id'), 10) || 1;
  const p = PROJECTS[id] || PROJECTS[1];
  document.title = `${p.title} — Garvit Yaggik`;

  const ids = Object.keys(PROJECTS).map(n => parseInt(n, 10));
  const idx = ids.indexOf(id);
  const prev = PROJECTS[ids[(idx - 1 + ids.length) % ids.length]];
  const next = PROJECTS[ids[(idx + 1) % ids.length]];
  const prevId = ids[(idx - 1 + ids.length) % ids.length];
  const nextId = ids[(idx + 1) % ids.length];

  const tagsHtml = p.tags.map(t => `<span>${t}</span>`).join('');

  // Media section — PDF or image carousel
  let mediaHtml = '';
  if (p.type === 'pdf') {
    mediaHtml = `
      <div class="pdf-wrap">
        <iframe src="${p.pdfUrl}" allow="autoplay"></iframe>
        <a href="${p.pdfFullscreen}" target="_blank" rel="noopener" class="pdf-link">Open in fullscreen →</a>
      </div>`;
  } else if (p.images && p.images.length > 1) {
    const imgsHtml = p.images.map((src, i) => `<img src="${src}" alt="${p.title} — ${i+1}" class="${i===0?'active':''}" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.style.display='none';" />`).join('');
    const dotsHtml = p.images.map((_, i) => `<span class="carousel-dot${i===0?' active':''}" data-idx="${i}"></span>`).join('');
    mediaHtml = `
      <div class="project-carousel" id="projCarousel">
        <div class="carousel-track">${imgsHtml}</div>
        <button class="carousel-btn carousel-btn-l" id="carL">‹</button>
        <button class="carousel-btn carousel-btn-r" id="carR">›</button>
        <div class="carousel-dots">${dotsHtml}</div>
      </div>`;
  } else if (p.images && p.images.length === 1) {
    mediaHtml = `<img src="${p.images[0]}" alt="${p.title}" class="project-img" style="margin:56px 0;border-radius:var(--radius);" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.style.display='none';" />`;
  }

  document.getElementById('projectPage').innerHTML = `
    <div class="project-hero">
      <span class="project-cat-tag">${p.category}</span>
      <h1>${p.title}</h1>
      <div class="project-tags-row">${tagsHtml}</div>
      <div class="info-bar">
        <div class="info-cell"><div class="lbl">Year</div><div class="val">${p.year}</div></div>
        <div class="info-cell"><div class="lbl">Client</div><div class="val">${p.client}</div></div>
        <div class="info-cell"><div class="lbl">Role</div><div class="val">${p.role}</div></div>
        <div class="info-cell"><div class="lbl">Tools</div><div class="val">${p.tools}</div></div>
      </div>
    </div>
    ${mediaHtml}
    <div class="two-col">
      <div class="block"><h3>Overview</h3><p>${p.overview}</p></div>
      <div class="block"><h3>Challenge</h3><p>${p.challenge}</p></div>
    </div>
    <div class="block" style="margin-top:56px"><h3>Solution</h3><p>${p.solution}</p></div>
    <div class="outcome-card"><div class="lbl">// Outcome</div><p>${p.outcome}</p></div>
    <div class="pn-row">
      <a class="pn-card prev" href="project.html?id=${prevId}"><div class="dir">← Previous</div><div class="name">${prev.title}</div></a>
      <a class="pn-card next" href="project.html?id=${nextId}"><div class="dir">Next →</div><div class="name">${next.title}</div></a>
    </div>
  `;

  // Carousel logic
  const carousel = document.getElementById('projCarousel');
  if (carousel) {
    const track = carousel.querySelector('.carousel-track');
    const imgs = track.querySelectorAll('img');
    const dots = carousel.querySelectorAll('.carousel-dot');
    let cur = 0;
    function goTo(i) {
      cur = (i + imgs.length) % imgs.length;
      imgs.forEach((img, j) => img.classList.toggle('active', j === cur));
      dots.forEach((d, j) => d.classList.toggle('active', j === cur));
    }
    document.getElementById('carL').addEventListener('click', () => goTo(cur - 1));
    document.getElementById('carR').addEventListener('click', () => goTo(cur + 1));
    dots.forEach(d => d.addEventListener('click', () => goTo(parseInt(d.dataset.idx))));
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') goTo(cur - 1);
      if (e.key === 'ArrowRight') goTo(cur + 1);
    });
  }
})();
</script>
