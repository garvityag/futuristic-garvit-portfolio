</head>
<body>

<header class="topbar">
  <a href="../index.html" class="logo" aria-label="Home">GY®</a>
  <nav aria-label="Main">
    <a href="../index.html#work" class="active">Work</a>

</header>
<div class="mobile-menu" id="mobileMenu">
  <button class="close mono" data-menu-close>Close ✕</button>
  <a href="../index.html#work"><span>01</span>Work</a>

</div>

<main class="wrap" id="cs"></main>

<footer class="site-foot mono">
  <span>© <span data-year>2026</span> Garvit Yaggik</span>
  <nav><a href="../index.html#work">Work</a><a href="../index.html#about">About</a><a href="resume.html">Resume</a></nav>
  <a href="mailto:garvityagnik@gmail.com">garvityagnik@gmail.com</a>
</footer>

<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  // Support new ?p=slug links and old ?id=N links
  const legacy = { 1: 'stratigen', 2: 'luxora', 3: 'nexa-spaces', 4: 'corporate-booth', 5: 'isc-west', 6: 'imc-booth', 7: 'exhibition-graphics', 8: 'magazine-ads', 9: 'corporate-magazine', 10: 'corporate-report' };
  const slug = q.get('p') || legacy[q.get('id')] || PROJECTS[0].slug;
  const i = Math.max(0, PROJECTS.findIndex(p => p.slug === slug));
  const p = PROJECTS[i];
  const next = PROJECTS[(i + 1) % PROJECTS.length];
  const cat = (CATEGORIES.find(c => c.id === p.category) || {}).label || '';
  document.title = `${p.title} · Garvit Yaggik`;

  const nda = /NDA/.test(p.client);
  const gallery = (p.images || []).slice(1).map(id =>
    `<img src="${driveImg(id, 2000)}" alt="${p.title}" loading="lazy" referrerpolicy="no-referrer" data-drive="${id}" data-slug="${p.slug}" class="reveal">`).join('');

  document.getElementById('cs').innerHTML = `
    <section class="cs-hero">
      <a href="../index.html#work" class="cs-back mono">← All work</a>
      <span class="cs-cat mono">GY–${String(i + 1).padStart(2, '0')} · ${cat}</span>
      <h1 class="cs-title">${p.title}</h1>
      <p class="cs-kicker">${p.kicker}</p>
      <dl class="cs-meta">
        <div><dt class="mono">Year</dt><dd>${p.year}</dd></div>
        <div><dt class="mono">Client</dt><dd>${p.client}</dd></div>
        <div><dt class="mono">Role</dt><dd>${p.role}</dd></div>
        <div><dt class="mono">Tools</dt><dd>${p.tools}</dd></div>
      </dl>
    </section>
    <div class="cs-cover reveal">${mediaFor(p, i, 2200)}</div>
    <section class="cs-body">
      <div class="cs-block reveal"><h2 class="mono">The brief</h2><div class="content"><p>${p.brief}</p></div></div>
      <div class="cs-block reveal"><h2 class="mono">What I did</h2><div class="content"><ol class="cs-steps">${p.approach.map(a => `<li>${a}</li>`).join('')}</ol></div></div>
      <div class="cs-block reveal"><h2 class="mono">Outcome</h2><div class="content cs-outcome">
        ${p.stat ? `<div class="big">${p.stat.value}<small>${p.stat.label}</small></div>` : ''}
        <p>${p.outcome}</p>
      </div></div>
    </section>
    ${p.pdf ? `<div class="cs-pdf reveal"><iframe src="https://drive.google.com/file/d/${p.pdf}/preview" title="${p.title} presentation" loading="lazy"></iframe>
      <p style="margin-top:14px"><a class="arrow-link" href="https://drive.google.com/file/d/${p.pdf}/view" target="_blank" rel="noopener">Open full presentation</a></p></div>` : ''}
    ${gallery ? `<div class="cs-gallery">${gallery}</div>` : ''}
    ${nda ? `<p class="cs-nda mono">Internal work. Names, data and logos are withheld under NDA. Full walkthrough available in interview.</p>` : ''}
    <a class="cs-next" href="project.html?p=${next.slug}">
      <span class="mono">Next project →</span>
      <h3>${next.title}</h3>
    </a>`;
  wireImageFallbacks(document.getElementById('cs'));
  observeReveals(document.getElementById('cs'));
})();
</script>
</body>
</html>
