<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" fill="none">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="jacketHL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf9778"/>
      <stop offset="100%" stop-color="#a87155"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cf9778" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7a4f38" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16161c"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff6b2b"/>
    </linearGradient>
  </defs>

  <!-- Legs -->
  <path d="M115 360 L108 495 L138 495 L148 365 Z" fill="url(#pants)"/>
  <path d="M152 365 L162 495 L192 495 L185 360 Z" fill="url(#pants)"/>
  <!-- Shoes -->
  <path d="M104 488 Q98 498 116 498 L142 498 Q146 498 142 488 Z" fill="#050505"/>
  <path d="M158 488 Q154 498 158 498 L196 498 Q204 498 198 488 Z" fill="#050505"/>

  <!-- Jacket body -->
  <path d="M75 230 Q68 240 70 270 L82 380 L218 380 L230 270 Q232 240 225 230 L195 215 L165 230 L135 230 L105 215 Z" fill="url(#jacket)" stroke="#2a2a32" stroke-width="1.2"/>

  <!-- Jacket inner / shadow -->
  <path d="M218 380 L210 270 Q210 250 200 240 L190 360 Z" fill="url(#jacketHL)" opacity="0.45"/>

  <!-- Lapels -->
  <path d="M105 215 L130 280 L145 240 L132 222 Z" fill="#080810"/>
  <path d="M195 215 L170 280 L155 240 L168 222 Z" fill="#080810"/>

  <!-- Shirt collar / inner -->
  <path d="M135 230 L150 268 L165 230 L150 220 Z" fill="#0e0e14"/>

  <!-- Pocket square — orange accent -->
  <path d="M188 268 L210 268 L208 282 L190 282 Z" fill="url(#pocket)"/>
  <path d="M188 268 L210 268 L208 274 L190 274 Z" fill="#fff" opacity="0.18"/>

  <!-- Subtle pin -->
  <circle cx="118" cy="276" r="2.4" fill="#ff6b2b"/>

  <!-- Neck -->
  <path d="M133 188 L133 220 L167 220 L167 188 Z" fill="url(#skin)"/>
  <path d="M167 188 L167 220 L150 220 Z" fill="url(#skinShade)"/>

  <!-- Head -->
  <ellipse cx="150" cy="135" rx="56" ry="64" fill="url(#skin)"/>
  <path d="M150 71 Q206 75 206 135 Q206 188 178 196 L178 80 Z" fill="url(#skinShade)"/>

  <!-- Hair -->
  <path d="M94 130 Q92 78 150 72 Q208 78 206 130 Q206 110 188 102 Q170 90 150 90 Q130 90 112 102 Q94 110 94 130 Z" fill="url(#hair)"/>
  <path d="M94 130 Q90 156 99 174 L104 168 Q96 152 100 134 Z" fill="url(#hair)"/>
  <path d="M206 130 Q210 156 201 174 L196 168 Q204 152 200 134 Z" fill="url(#hair)"/>
  <!-- Hair texture lines -->
  <path d="M115 100 Q140 86 165 92" stroke="#000" stroke-width="0.6" opacity="0.5" fill="none"/>
  <path d="M125 96 Q150 84 175 96" stroke="#000" stroke-width="0.6" opacity="0.5" fill="none"/>

  <!-- Eyebrows -->
  <path d="M114 132 Q126 126 138 132" stroke="#1a1410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M162 132 Q174 126 186 132" stroke="#1a1410" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <circle cx="126" cy="148" r="15" fill="rgba(255,255,255,0.04)" stroke="#f5f0eb" stroke-width="2.2"/>
  <circle cx="174" cy="148" r="15" fill="rgba(255,255,255,0.04)" stroke="#f5f0eb" stroke-width="2.2"/>
  <line x1="141" y1="148" x2="159" y2="148" stroke="#f5f0eb" stroke-width="2.2"/>
  <line x1="111" y1="148" x2="100" y2="144" stroke="#f5f0eb" stroke-width="2.2"/>
  <line x1="189" y1="148" x2="200" y2="144" stroke="#f5f0eb" stroke-width="2.2"/>

  <!-- Eyes -->
  <circle cx="126" cy="148" r="2.4" fill="#1a1410"/>
  <circle cx="174" cy="148" r="2.4" fill="#1a1410"/>

  <!-- Nose -->
  <path d="M150 152 L146 174 Q150 178 154 174 Z" fill="none" stroke="#7a4f38" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M136 188 Q150 194 164 188" stroke="#5a3a28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Stubble hint -->
  <path d="M120 178 Q150 196 180 178" stroke="#1a1410" stroke-width="0.8" opacity="0.18" fill="none"/>

  <!-- Ears -->
  <ellipse cx="92" cy="148" rx="6" ry="11" fill="url(#skin)"/>
  <ellipse cx="208" cy="148" rx="6" ry="11" fill="url(#skin)"/>

  <!-- Arms (subtle, behind body) -->
  <path d="M70 270 Q60 320 70 360 L82 360 L82 270 Z" fill="url(#jacket)"/>
  <path d="M230 270 Q240 320 230 360 L218 360 L218 270 Z" fill="url(#jacket)"/>

  <!-- Buttons -->
  <circle cx="150" cy="295" r="2" fill="#0a0a0e"/>
  <circle cx="150" cy="320" r="2" fill="#0a0a0e"/>
  <circle cx="150" cy="345" r="2" fill="#0a0a0e"/>
</svg>
